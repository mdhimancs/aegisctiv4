<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Soft shadow matching shadow-md -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Website Header Container: w-8 h-8 rounded-lg bg-red-600 border border-red-500/30 -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" ry="7.5"
        fill="#dc2626"
        stroke="#ef4444"
        stroke-opacity="0.35"
        stroke-width="1"
        filter="url(#badgeShadow)" />

  <!-- Lucide ShieldAlert: w-4 h-4 text-white (centered, stroke-width 2.2 for crisp browser tab visibility) -->
  <g transform="translate(5.5, 5.5) scale(0.875)"
     fill="none"
     stroke="#ffffff"
     stroke-width="2.2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
    <path d="M12 8v4" />
    <path d="M12 16h.01" />
  </g>
</svg>