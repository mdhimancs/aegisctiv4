<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="aegisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#020617" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- High contrast rounded background squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#aegisBg)" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Tactical Cyber Defense Shield Emblem -->
  <path d="M16 4.8 C18.8 6.4 21.8 7.0 24.5 7.0 C24.5 14.2 21.2 19.8 16 23.8 C10.8 19.8 7.5 14.2 7.5 7.0 C10.2 7.0 13.2 6.4 16 4.8 Z"
        fill="#090d16" stroke="url(#shieldRim)" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Alert Core Exclamation Marker -->
  <path d="M16 9.2 L16 15.2" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="16" cy="19" r="1.3" fill="#ffffff"/>
</svg>